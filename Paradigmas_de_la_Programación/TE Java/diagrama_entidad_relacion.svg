<text x="1060" y="987.0" text-anchor="start" font-size="16" font-weight="400" fill="#1f2933"><tspan x="1060" dy="0">QUIROFANO.estado usa HABILITADO, MANTENIMIENTO o FUERA_DE_SERVICIO.</tspan><tspan x="1060" dy="23">La disponibilidad horaria se calcula revisando turnos existentes.</tspan><tspan x="1060" dy="23">Cada turno debe tener exactamente un profesional con rol CIRUJANO_PRINCIPAL.</tspan></text>
